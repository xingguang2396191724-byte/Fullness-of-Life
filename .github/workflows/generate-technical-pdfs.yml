name: Generate public technical specification PDFs

concurrency:
  group: generate-technical-pdfs
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-technical-pdfs.yml"
      - "scripts/update_technical_pdfs.py"
      - "products/*.html"

permissions:
  contents: write

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependencies
        run: python -m pip install reportlab qrcode[pil]
      - name: Generate PDFs
        run: python scripts/update_technical_pdfs.py
      - name: Commit generated PDFs
        run: |
          git config user.name "JingBear Bot"
          git config user.email "actions@github.com"
          git add assets/technical-specs/*.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes."
          else
            git commit -m "Update public technical specification PDFs"
            git fetch origin main
            git rebase origin/main
            git push
          fi
