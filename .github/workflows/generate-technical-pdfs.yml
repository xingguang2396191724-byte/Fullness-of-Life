name: Generate public technical specification PDFs

concurrency:
  group: generate-technical-pdfs
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-technical-pdfs.yml"
      - "products/f-430s.html"
      - "products/f-660.html"
      - "products/f-680.html"
      - "products/f-930.html"
      - "products/f-930s.html"
      - "products/f-932.html"

permissions:
  contents: write

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PDF renderer
        run: python -m pip install reportlab

      - name: Generate PDFs
        run: |
          mkdir -p assets/technical-specs
          python <<'PY'
          from reportlab.lib import colors
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib.enums import TA_LEFT
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle, KeepTogether
          from reportlab.lib.units import mm
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.pdfbase import pdfmetrics
          from pathlib import Path

          out = Path("assets/technical-specs")
          out.mkdir(parents=True, exist_ok=True)

          models = [
            ("F-430S", "Spray extraction + steam cleaning machine", "f-430s", [
              ("Power supply", "220 V"), ("Suction power", "1,000 W"), ("Spray power", "40 W"),
              ("Clean-water tank", "4 L"), ("Recovery tank", "12 L"), ("Airflow", "180 m³/h"),
              ("Hose length", "400 cm"), ("Power cord", "10 m"),
              ("Functions", "Spray extraction · Steam · Vacuum · Water suction"),
              ("Dimensions", "53 × 37 × 65 cm"), ("Net weight", "20 kg")
            ]),
            ("F-660", "Commercial fabric cleaning machine", "f-660", [
              ("Power supply", "220 V / 50 Hz"), ("Suction motor", "1,000 W"), ("Foam motor", "100 W"),
              ("Brush motor", "40 W"), ("Clean-water tanks", "4 + 10 L"), ("Recovery tank", "30 L"),
              ("Airflow", "180 m³/h"), ("Hose length", "4 m"), ("Net weight", "28 kg")
            ]),
            ("F-680", "Steam-enabled fabric cleaning machine", "f-680", [
              ("Power supply", "220 V / 50 Hz"), ("Suction motor", "1,000 W"), ("Foam motor", "100 W"),
              ("Brush motor", "40 W"), ("Clean-water tanks", "4 + 16 L"), ("Recovery tank", "13 L"),
              ("Airflow", "180 m³/h"), ("Hose length", "4 m"), ("Heater", "3,300 W"),
              ("Steam temperature", "150 °C"), ("Net weight", "32 kg")
            ]),
            ("F-930", "3-in-1 cold-water carpet extractor", "f-930", [
              ("Power supply", "220 V / 50 Hz"), ("Suction motor", "1,000 W"), ("Brush motor", "120 W"),
              ("Water pump", "110 W"), ("Clean-water tank", "40 L"), ("Recovery tank", "30 L"),
              ("Working width", "450 mm"), ("Power cord", "15 m"), ("Suction", "29 kPa"), ("Net weight", "40 kg")
            ]),
            ("F-930S", "4-in-1 steam carpet extractor", "f-930s", [
              ("Power supply", "220 V / 50 Hz"), ("Suction motor", "1,200 W"), ("Brush motor", "120 W"),
              ("Water pump", "110 W"), ("Heater", "2,600 W"), ("Clean-water tank", "40 L"),
              ("Recovery tank", "30 L"), ("Working width", "450 mm"), ("Suction", "30 kPa"), ("Net weight", "42 kg")
            ]),
            ("F-932", "Dual-motor carpet extractor", "f-932", [
              ("Power supply", "220 V / 50 Hz"), ("Suction motors", "2 × 1,000 W"), ("Brush motor", "120 W"),
              ("Water pump", "110 W"), ("Clean-water tank", "40 L"), ("Recovery tank", "30 L"),
              ("Working width", "450 mm"), ("Power cord", "15 m"), ("Suction", "38 kPa"), ("Net weight", "40 kg")
            ]),
          ]

          styles = getSampleStyleSheet()
          title = ParagraphStyle("Title2", parent=styles["Title"], fontName="Helvetica-Bold", fontSize=24, leading=28, textColor=colors.HexColor("#12352f"), spaceAfter=6)
          subtitle = ParagraphStyle("Sub", parent=styles["Normal"], fontName="Helvetica", fontSize=11, leading=15, textColor=colors.HexColor("#50605c"), spaceAfter=16)
          h2 = ParagraphStyle("H2", parent=styles["Heading2"], fontName="Helvetica-Bold", fontSize=12, leading=15, textColor=colors.HexColor("#12352f"), spaceBefore=14, spaceAfter=7)
          body = ParagraphStyle("Body2", parent=styles["BodyText"], fontName="Helvetica", fontSize=9.5, leading=14, textColor=colors.HexColor("#26332f"))
          small = ParagraphStyle("Small", parent=body, fontSize=8, leading=11, textColor=colors.HexColor("#68736f"))

          for model, subtitle_text, slug, rows in models:
              path = out / f"{slug}-JingBear-Technical-Specification.pdf"
              doc = SimpleDocTemplate(str(path), pagesize=A4, rightMargin=18*mm, leftMargin=18*mm, topMargin=18*mm, bottomMargin=18*mm,
                                      title=f"{model} | JingBear Technical Specification",
                                      author="JingBear")
              story = [
                Paragraph("JINGBEAR", ParagraphStyle("brand", parent=body, fontName="Helvetica-Bold", fontSize=9, textColor=colors.HexColor("#4f8b74"), spaceAfter=18)),
                Paragraph("Technical Specification", title),
                Paragraph(f"<b>{model}</b> · {subtitle_text}", subtitle),
              ]
              data = [[Paragraph("<b>Parameter</b>", body), Paragraph("<b>Documented value</b>", body)]]
              for k, v in rows:
                  data.append([Paragraph(k, body), Paragraph(v, body)])
              table = Table(data, colWidths=[58*mm, 108*mm], repeatRows=1)
              table.setStyle(TableStyle([
                ("BACKGROUND", (0,0), (-1,0), colors.HexColor("#edf4f0")),
                ("TEXTCOLOR", (0,0), (-1,0), colors.HexColor("#12352f")),
                ("GRID", (0,0), (-1,-1), 0.35, colors.HexColor("#d5ded9")),
                ("VALIGN", (0,0), (-1,-1), "TOP"),
                ("LEFTPADDING", (0,0), (-1,-1), 7),
                ("RIGHTPADDING", (0,0), (-1,-1), 7),
                ("TOPPADDING", (0,0), (-1,-1), 6),
                ("BOTTOMPADDING", (0,0), (-1,-1), 6),
              ]))
              story += [table, Spacer(1, 10), Paragraph("Application", h2),
                        Paragraph("Professional cleaning workflows such as carpet, upholstery, fabric or vehicle-interior cleaning, subject to the selected configuration and application.", body),
                        Paragraph("Export & configuration note", h2),
                        Paragraph("Confirm destination voltage/frequency, plug, electrical load, packing, delivery terms, documentation and any destination-specific compliance before ordering. Final configuration is confirmed in a written quotation.", body),
                        Spacer(1, 12),
                        Paragraph("JingBear is a B2B equipment sourcing and solution partner. Technical figures are based on available product documentation; they are not a substitute for a destination-specific quotation.", small)]
              doc.build(story)

          print("Generated:", ", ".join(p.name for p in out.glob("*.pdf")))
          PY

      - name: Commit generated PDFs
        run: |
          git config user.name "JingBear Bot"
          git config user.email "actions@github.com"
          git add assets/technical-specs/*.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes."
          else
            git commit -m "Add public technical specification PDFs"
          git fetch origin main
          git rebase origin/main
          git push
          fi
