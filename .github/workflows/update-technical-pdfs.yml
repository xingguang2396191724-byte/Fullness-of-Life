name: Update technical specification PDFs

on:
  push:
    paths:
      - "scripts/update_technical_pdfs.py"

permissions:
  contents: write

jobs:
  update-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependencies
        run: pip install reportlab pypdf qrcode[pil]
      - name: Generate PDFs
        run: python scripts/update_technical_pdfs.py
      - name: Commit PDFs
        run: |
          git config user.name "JingBear PDF Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/technical-specs/*.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Add WhatsApp contact bridge to technical PDFs"
          git push
